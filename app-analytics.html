<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>App analytics · The Hour Brief</title>
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<!-- Owner-only. How people use The Hour Brief on iPhone, Android and the web: is it growing, is the daily habit working,
     which features land, where the platforms differ, and do new app users come back. Data: GET /api/track?action=app
     (api/track.js), with the same STATS_KEY as growth.html (kept in this browser after /growth.html#key=...).
     Counts come from mobile.js use() (f:<date>), the apps' launch pings (active:<date>) and installs (g:<date> i|<pf>). -->
<style>
  :root {
    color-scheme: light;
    --page: #f6f5fb; --surface: #ffffff; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #ecebf2; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.09); --accent: #5e43f3; --accent-soft: #efecfe;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --all: #5e43f3; --deemph: #c9c7d6;
    --good: #006300; --bad: #d03b3b;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0f1017; --surface: #191a24; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #262734; --axis: #3a3b48; --border: rgba(255, 255, 255, 0.09); --accent: #8f7cff; --accent-soft: #25213f;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --all: #8f7cff; --deemph: #3d3e4c;
      --good: #0ca30c; --bad: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0f1017; --surface: #191a24; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #262734; --axis: #3a3b48; --border: rgba(255, 255, 255, 0.09); --accent: #8f7cff; --accent-soft: #25213f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --all: #8f7cff; --deemph: #3d3e4c;
    --good: #0ca30c; --bad: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 var(--font); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--accent); }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
  .sub { margin: 2px 0 0; color: var(--ink-2); font-size: 0.9rem; }
  .back { font-size: 0.88rem; text-decoration: none; }

  /* One filter row, above everything it scopes */
  .filters { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 0; margin-bottom: 8px; background: var(--page); }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .seg button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 0.86rem; padding: 6px 12px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  .seg button:focus-visible, .row:focus-visible, .dot:focus-visible, svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .flabel { font-size: 0.78rem; color: var(--muted); }
  .fgroup { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .refresh { border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; font-size: 0.86rem; font-weight: 600; padding: 7px 12px; border-radius: 10px; cursor: pointer; }
  .refresh:disabled { opacity: .55; cursor: default; }

  #app { transition: opacity .15s; }
  #app.loading { opacity: .45; }
  section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 14px; }
  section.card > h2 { margin: 0; font-size: 1.12rem; letter-spacing: -0.01em; }
  section.card > .q { margin: 2px 0 16px; color: var(--ink-2); font-size: 0.88rem; }
  .verdict { display: inline-block; margin: 0 0 14px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 0.92rem; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; min-width: 0; }
  .kpi .l { font-size: 0.8rem; color: var(--ink-2); }
  .kpi .v { font-size: 2rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; margin-top: 2px; }
  .kpi .v small { font-size: 0.9rem; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .kpi .d { font-size: 0.8rem; margin-top: 2px; color: var(--muted); }
  .kpi svg { display: block; margin-top: 8px; width: 100%; height: 28px; }
  .up { color: var(--good); } .down { color: var(--bad); }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .v { font-size: 1.6rem; } }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; font-size: 0.82rem; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
  .legend i.dotk { width: 10px; height: 10px; border-radius: 50%; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .ax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .gl { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--axis); stroke-width: 1; }
  .tip { position: absolute; z-index: 4; pointer-events: none; min-width: 120px; padding: 8px 10px; border-radius: 10px; background: var(--ink); color: var(--page); font-size: 0.8rem; line-height: 1.45; opacity: 0; transition: opacity .08s; white-space: nowrap; }
  .tip.on { opacity: 1; }
  .tip .t { color: var(--muted); font-size: 0.74rem; margin-bottom: 2px; }
  .tip .r { display: flex; align-items: center; gap: 8px; }
  .tip .r i { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
  .tip .r b { font-weight: 650; }

  /* Funnels */
  .funnels { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px 28px; }
  @media (max-width: 760px) { .funnels { grid-template-columns: 1fr; } }
  .fn h3 { margin: 0 0 10px; font-size: 0.92rem; }
  .step { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; margin-bottom: 12px; }
  .step .n { display: flex; justify-content: space-between; gap: 10px; font-size: 0.86rem; }
  .step .n span:last-child { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  .track { position: relative; height: 18px; }
  .bar { position: absolute; left: 0; top: 0; height: 18px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar + b { position: absolute; top: 0; font-size: 0.8rem; font-weight: 650; line-height: 18px; padding-left: 6px; font-variant-numeric: tabular-nums; }
  .drop { font-size: 0.76rem; color: var(--muted); margin: -6px 0 8px; padding-left: 2px; }

  /* Ranked reach */
  .rank { margin: 0; padding: 0; list-style: none; }
  .row { display: grid; grid-template-columns: minmax(130px, 34%) 1fr 92px; gap: 12px; align-items: center; padding: 7px 4px; border-radius: 8px; cursor: pointer; }
  .row:hover { background: var(--accent-soft); }
  .row .nm { font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nm small { color: var(--muted); font-size: 0.74rem; margin-left: 6px; }
  .row .track { height: 14px; }
  .row .bar { height: 14px; }
  .row .bar + b { line-height: 14px; font-size: 0.78rem; }
  .row .ch { text-align: right; font-size: 0.78rem; white-space: nowrap; color: var(--muted); }
  .rank li.split { list-style: none; margin: 10px 4px 6px; font-size: 0.74rem; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .detail { margin: 2px 4px 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; }
  .detail p { margin: 0 0 6px; font-size: 0.84rem; color: var(--ink-2); }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr 72px; } .row .track { grid-column: 1 / -1; grid-row: 2; } }

  /* Dot plot */
  .dp { position: relative; }
  .dprow { display: grid; grid-template-columns: minmax(120px, 30%) 1fr; gap: 12px; align-items: center; height: 34px; }
  .dprow .nm { font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dptrack { position: relative; height: 34px; }
  .dptrack::before { content: ""; position: absolute; left: 0; right: 0; top: 16px; height: 1px; background: var(--grid); }
  .dpspan { position: absolute; top: 15px; height: 3px; border-radius: 2px; background: var(--deemph); }
  .dot { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; border: 2px solid var(--surface); cursor: default; }
  .dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
  .dpaxis { display: grid; grid-template-columns: minmax(120px, 30%) 1fr; gap: 12px; }
  .dpaxis > div + div { position: relative; height: 18px; border-top: 1px solid var(--axis); }
  .dpaxis > div > span { position: absolute; top: 2px; transform: translateX(-50%); }

  /* Retention */
  .ret { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  @media (max-width: 760px) { .ret { grid-template-columns: 1fr 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th { text-align: right; font-weight: 600; color: var(--ink-2); font-size: 0.76rem; padding: 6px 8px; border-bottom: 1px solid var(--axis); }
  td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  .meter { display: inline-block; width: 64px; height: 6px; margin-left: 8px; vertical-align: middle; border-radius: 3px; background: var(--grid); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--all); }
  .scroll { overflow-x: auto; }
  details.tv { margin-top: 14px; }
  details.tv summary { cursor: pointer; font-size: 0.86rem; color: var(--accent); }
  .muted { color: var(--muted); }
  .empty { padding: 18px; border: 1px dashed var(--axis); border-radius: 12px; color: var(--ink-2); font-size: 0.9rem; }
  .gate { max-width: 440px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .gate input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--page); color: var(--ink); font: inherit; margin: 10px 0; }
  .gate button { padding: 9px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .notes { font-size: 0.8rem; color: var(--ink-2); line-height: 1.6; padding-left: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>App analytics</h1>
      <p class="sub">How people use The Hour Brief on iPhone, Android and the website.</p>
    </div>
    <a class="back" href="/growth.html">← Growth report</a>
  </header>
  <div class="filters" id="filters" hidden>
    <span class="fgroup"><span class="flabel">Period</span>
    <div class="seg" role="group" aria-label="Period" id="f-days">
      <button type="button" data-v="1">Today</button><button type="button" data-v="7">7 days</button><button type="button" data-v="14">14 days</button><button type="button" data-v="30">30 days</button>
    </div></span>
    <span class="fgroup"><span class="flabel">Platform</span>
    <div class="seg" role="group" aria-label="Platform" id="f-pf">
      <button type="button" data-v="all">All</button>
      <button type="button" data-v="ios"><i class="key" style="background:var(--s1)"></i>iPhone</button>
      <button type="button" data-v="android"><i class="key" style="background:var(--s2)"></i>Android</button>
      <button type="button" data-v="web"><i class="key" style="background:var(--s3)"></i>Web</button>
    </div></span>
    <span class="fgroup"><button type="button" class="refresh" id="refresh">↻ Refresh</button><span class="flabel" id="upd"></span></span>
  </div>
  <div id="app"><p class="muted">Loading…</p></div>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  // ---------- setup ----------
  var KEY_STORE = 'hb-stats-key', key = '';
  var m = /[#&]key=([^&]+)/.exec(location.hash);
  if (m) { key = decodeURIComponent(m[1]); try { localStorage.setItem(KEY_STORE, key); } catch (e) {} history.replaceState(null, '', location.pathname); }
  if (!key) { try { key = localStorage.getItem(KEY_STORE) || ''; } catch (e) {} }
  var S = { days: 7, pf: 'all' };
  try { var sv = JSON.parse(localStorage.getItem('hb-appstats-view') || '{}'); if ([1, 7, 14, 30].indexOf(sv.days) >= 0) S.days = sv.days; if (/^(all|ios|android|web)$/.test(sv.pf)) S.pf = sv.pf; } catch (e) {}

  var PF = [{ id: 'ios', name: 'iPhone', c: 'var(--s1)' }, { id: 'android', name: 'Android', c: 'var(--s2)' }, { id: 'web', name: 'Web', c: 'var(--s3)' }];
  var PFN = { ios: 'iPhone', android: 'Android', web: 'Web' };
  // Keep in step with FEATURES in api/track.js (and mobile.js / quiz.js / listen.js, which count them).
  var F = [
    ['home', 'Home screen', 'Home', 1], ['home_tap', 'Tap something on Home', 'Home', 1],
    ['today', 'Read today’s edition', 'Reading', 1], ['cards_view', 'Cards view', 'Reading', 1], ['story_save', 'Save a story', 'Reading', 1],
    ['saved_list', 'Open saved stories', 'Reading'], ['story_share', 'Share a story', 'Reading', 1], ['story_vote', 'Vote on a story', 'Reading'],
    ['source_out', 'Open a story’s source', 'Reading'], ['edition_share', 'Share the edition', 'Reading'], ['past_editions', 'Past editions', 'Reading'],
    ['past_edition_read', 'Read a past edition', 'Reading'], ['weekly', 'Weekly recap', 'Reading', 1], ['weekly_card', 'Sunday recap card', 'Reading'], ['weekly_menu', 'Recap from the Menu', 'Reading'],
    ['audio_open', 'Audio screen', 'Listen', 1], ['audio_play', 'Play the audio', 'Listen', 1], ['audio_done', 'Listen to the end', 'Listen'],
    ['voices', 'Voices', 'Voices', 1], ['voices_article', 'Read a Voices article', 'Voices', 1],
    ['challenge_open', 'Challenge screen', 'Challenge', 1], ['quiz_start', 'Start the quiz', 'Challenge', 1], ['quiz_done', 'Finish the quiz', 'Challenge', 1],
    ['quiz_retake_start', 'Practice retake', 'Challenge'], ['quiz_share', 'Share a quiz score', 'Challenge'], ['league_create', 'Start a league', 'Challenge', 1],
    ['league_join', 'Join a league', 'Challenge', 1], ['league_invite', 'Send a league invite', 'Challenge'], ['badges_view', 'Badges tab', 'Challenge'],
    ['menu', 'Open the Menu', 'Settings'], ['you', 'Open You', 'Settings', 1], ['theme_set', 'Pick a theme', 'Settings'], ['sections', 'Sections', 'Settings'], ['text_size', 'Text size', 'Settings'], ['reminder', 'Daily reminder', 'Settings', 1],
    ['channel_out', 'Follow WhatsApp / Telegram', 'Follow'], ['podcast_out', 'Open a podcast app', 'Follow']
  ];
  var FN = {}; F.forEach(function (f) { FN[f[0]] = f[1]; });
  var MIN = 20;            // people-days a period needs before its percentages and changes are shown

  var app = document.getElementById('app'), tip = document.getElementById('tip'), data = null;
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'style') e.setAttribute('style', attrs[k]); else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, parent) { var e = document.createElementNS(SVGNS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  var fmt = function (n) { return n == null ? '–' : (Math.round(n) || 0).toLocaleString('en-IN'); };
  var dec = function (n) { return n == null ? '–' : n < 10 ? (Math.round(n * 10) / 10).toString() : fmt(n); };
  var pct = function (r) { return r == null ? '–' : (r > 0 && r < 0.1 ? (r * 100).toFixed(1) : Math.round(r * 100)) + '%'; };
  var short = function (d) { var p = d.split('-'); return +p[2] + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+p[1] - 1]; };

  // ---------- tooltip ----------
  function showTip(x, y, title, rows) {
    tip.textContent = '';
    if (title) tip.appendChild(h('div', { class: 't', text: title }));
    rows.forEach(function (r) {
      var row = h('div', { class: 'r' });
      if (r.c) row.appendChild(h('i', { style: 'background:' + r.c }));
      row.appendChild(h('b', { text: r.v }));
      row.appendChild(h('span', { text: r.l }));
      tip.appendChild(row);
    });
    tip.classList.add('on');
    var w = tip.offsetWidth, hh = tip.offsetHeight;
    var left = Math.min(Math.max(8, x - w / 2), document.documentElement.clientWidth - w - 8);
    tip.style.left = left + window.scrollX + 'px';
    tip.style.top = (y - hh - 12 + window.scrollY) + 'px';
  }
  function hideTip() { tip.classList.remove('on'); }
  function tipFor(el, title, rows) {
    var on = function () { var r = el.getBoundingClientRect(); showTip(r.left + r.width / 2, r.top, title, typeof rows === 'function' ? rows() : rows); };
    el.addEventListener('pointerenter', on); el.addEventListener('focus', on);
    el.addEventListener('pointerleave', hideTip); el.addEventListener('blur', hideTip);
  }

  // ---------- numbers ----------
  function pfs() { return S.pf === 'all' ? ['ios', 'android', 'web'] : [S.pf]; }
  function sum(days, field) { var t = 0; days.forEach(function (d) { t += d.f[field] || 0; }); return t; }
  function people(days, feat, list) { var t = 0; (list || pfs()).forEach(function (p) { t += sum(days, 'u|' + feat + '|' + p); }); return t; }
  function uses(days, feat, list) { var t = 0; (list || pfs()).forEach(function (p) { t += sum(days, feat + '|' + p); }); return t; }
  function reach(days, feat, list) { var a = people(days, 'open', list); return a ? people(days, feat, list) / a : null; }
  // cur: the period; prev: the same length just before (Today: yesterday); ctx: what the trend charts show (Today: the last 14
  // days, ending on today so far, since a one-day line says nothing).
  function periods() { var all = data.days, n = S.days; return { cur: all.slice(-n), prev: all.slice(-2 * n, -n), ctx: n === 1 ? all.slice(-14) : all.slice(-n) }; }
  var TODAY = function () { return S.days === 1; };
  function per() { return TODAY() ? 'today so far' : 'last ' + S.days + ' days'; }
  function before() { return TODAY() ? 'yesterday' : 'the ' + S.days + ' days before'; }
  function seriesColor() { return S.pf === 'all' ? 'var(--all)' : PF.filter(function (p) { return p.id === S.pf; })[0].c; }

  // ---------- charts ----------
  function sparkline(vals, color) {
    var w = 200, hgt = 28, svg = s('svg', { viewBox: '0 0 ' + w + ' ' + hgt, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var max = Math.max.apply(null, vals.concat([1]));
    var pts = vals.map(function (v, i) { return [vals.length > 1 ? i * w / (vals.length - 1) : w, hgt - 3 - (v / max) * (hgt - 6)]; });
    s('polyline', { points: pts.map(function (p) { return p.join(','); }).join(' '), fill: 'none', stroke: 'var(--deemph)', 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round' }, svg);
    var last = pts[pts.length - 1];
    if (last) s('circle', { cx: last[0], cy: last[1], r: 3, fill: color, 'vector-effect': 'non-scaling-stroke' }, svg);
    return svg;
  }
  // Lines over days, one per series, crosshair + one tooltip with every series. series: [{name, color, vals, fmt}]
  function lineChart(dates, series, opts) {
    opts = opts || {};
    var box = h('div', { class: 'chart' });
    var W = Math.max(280, app.clientWidth - 40), H = opts.h || 220, L = 40, R = opts.endLabels ? 70 : 12, T = 10, B = 26;
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, height: H, tabindex: 0, role: 'img', 'aria-label': opts.label || 'Line chart' });
    var max = 0;
    series.forEach(function (sr) { sr.vals.forEach(function (v) { if (v != null && v > max) max = v; }); });
    if (opts.max) max = opts.max;
    var step = niceStep(max || 1), top = Math.max(step, Math.ceil((max || 1) / step) * step);
    var x = function (i) { return L + (dates.length > 1 ? i * (W - L - R) / (dates.length - 1) : (W - L - R) / 2); };
    var y = function (v) { return T + (1 - v / top) * (H - T - B); };
    for (var t = 0; t <= top + 1e-9; t += step) {
      s('line', { x1: L, x2: W - R, y1: y(t), y2: y(t), class: t ? 'gl' : 'base' }, svg);

      var tr = h('tr', {}, [h('td', { text: f[1] })]);
      PF.forEach(function (p) {
        tr.appendChild(h('td', { text: f[0] === 'open' ? fmt(people(P.cur, 'open', [p.id])) + ' people-days' : pct(reach(P.cur, f[0], [p.id])) }));
        tr.appendChild(h('td', { text: fmt(uses(P.cur, f[0], [p.id])) }));
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    d.appendChild(h('div', { class: 'scroll' }, [t]));
    c.appendChild(d);
    c.appendChild(h('ul', { class: 'notes' }, [
      h('li', { text: 'People-days: each phone or browser counts once a day per feature (it remembers that itself; no ID is sent). Uses count every time.' }),
      h('li', { text: 'Changes compare with the same number of days just before, and only show once both periods have at least ' + MIN + ' people-days.' }),
      h('li', { text: 'Feature counting started on 22 Nov 2026; the Badges tab and the Sunday recap card count from their release. App installs and return rates come from the apps’ own launch reports.' })
    ]));
    return c;
  }
  function empty() { return h('p', { class: 'empty', text: 'No counts in these days yet. Feature counting started on 22 Nov 2026: give it a day of readers.' }); }

  // ---------- render, filters, load ----------
  function render() {
    if (!data) return;
    var P = periods();
    var y = window.scrollY;
    app.textContent = '';
    [growth, habit, landing, platforms, comeBack, numbers].forEach(function (fn) { app.appendChild(fn(P)); });
    window.scrollTo(0, y);
  }
  function syncFilters() {
    document.querySelectorAll('#f-days button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.v === S.days)); });
    document.querySelectorAll('#f-pf button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === S.pf)); });
    try { localStorage.setItem('hb-appstats-view', JSON.stringify(S)); } catch (e) {}
  }
  document.querySelectorAll('#f-days button').forEach(function (b) { b.addEventListener('click', function () { S.days = +b.dataset.v; syncFilters(); load(); }); });
  document.querySelectorAll('#f-pf button').forEach(function (b) { b.addEventListener('click', function () { S.pf = b.dataset.v; syncFilters(); render(); }); });
  var rT = 0, lastW = window.innerWidth;
  window.addEventListener('resize', function () { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rT); rT = setTimeout(render, 150); });
  function askKey(msg) {
    app.textContent = '';
    document.getElementById('filters').hidden = true;
    var inp = h('input', { type: 'password', placeholder: 'Stats key', 'aria-label': 'Stats key' });
    var go = h('button', { type: 'button', text: 'Show the analytics' });
    go.addEventListener('click', function () { key = inp.value.trim(); try { localStorage.setItem(KEY_STORE, key); } catch (e) {} load(); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go.click(); });
    app.appendChild(h('div', { class: 'gate' }, [h('b', { text: 'Owner only' }), h('p', { class: 'sub', text: msg || 'Enter the stats key (the same one the growth report uses).' }), inp, go]));
  }
  function load() {
    if (!key) { askKey(); return; }
    document.getElementById('filters').hidden = false;
    app.classList.add('loading');
    fetch('/api/track?action=app&days=' + Math.max(S.days * 2, 14) + '&key=' + encodeURIComponent(key), { cache: 'no-store' })
      .then(function (r) { if (r.status === 401) throw new Error('key'); if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (d) { data = d; app.classList.remove('loading'); render(); stamp(); })
      .catch(function (e) {
        refreshBtn.disabled = false; refreshBtn.textContent = '↻ Refresh';
        app.classList.remove('loading');
        if (e.message === 'key') { try { localStorage.removeItem(KEY_STORE); } catch (x) {} askKey('That key did not work.'); }
        else if (!data) app.innerHTML = '<p class="empty">Could not load the analytics (' + e.message + '). Try again in a minute.</p>';
      });
  }
  var refreshBtn = document.getElementById('refresh'), updEl = document.getElementById('upd'), hiddenAt = 0;
  function stamp() {
    refreshBtn.disabled = false; refreshBtn.textContent = '↻ Refresh';
    var d = new Date();
    updEl.textContent = 'Updated ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  refreshBtn.addEventListener('click', function () { refreshBtn.disabled = true; refreshBtn.textContent = 'Refreshing…'; load(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') hiddenAt = Date.now();
    else if (hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000 && key) load();
  });
  syncFilters();
  load();
})();
</script>
</body>
</html>
