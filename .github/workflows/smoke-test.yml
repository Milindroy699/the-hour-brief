name: Smoke test

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Runs ~20 min after the daily publish routine (2:30 UTC), independent of it
    - cron: '0 3 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy to propagate
        if: github.event_name == 'push'
        run: sleep 45

      - name: Run checks
        run: |
          set -e
          BASE="https://the-hour-brief.vercel.app"
          fail=0

          check_status() {
            url="$1"; expect="$2"
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" != "$expect" ]; then
              echo "::error::$url returned $code (expected $expect)"
              fail=1
            else
              echo "OK  $url -> $code"
            fi
          }

          check_status "$BASE/" 200
          check_status "$BASE/archive/" 200
          check_status "$BASE/feed.xml" 200
          check_status "$BASE/about.html" 200
          check_status "$BASE/privacy.html" 200
          check_status "$BASE/capacitor-bridge.js" 200
          check_status "$BASE/mobile.css" 200
          check_status "$BASE/mobile.js" 200
          check_status "$BASE/quiz.js" 200
          check_status "$BASE/quiz.css" 200
          check_status "$BASE/reader.css" 200
          check_status "$BASE/listen.js" 200
          check_status "$BASE/og-image.png" 200

          echo "--- checking every archived edition referenced in editions.json ---"
          python3 - "$BASE" <<'PYEOF'
          import json, sys, urllib.request

          base = sys.argv[1]
          req = urllib.request.urlopen(f"{base}/editions.json")
          data = json.load(req)

          bad = []
          for ed in data.get("editions", []):
              path = ed["path"]
              url = f"{base}/{path}"
              try:
                  r = urllib.request.urlopen(url)
                  code = r.status
              except Exception as e:
                  code = getattr(e, "code", "ERR")
              status = "OK " if code == 200 else "FAIL"
              print(f"{status} {url} -> {code}")
              if code != 200:
                  bad.append(url)

          if bad:
              print(f"::error::{len(bad)} archived edition(s) broken: {bad}")
              sys.exit(1)
          PYEOF

          echo "--- checking API routes respond with valid JSON ---"
          vote_resp=$(curl -s "$BASE/api/vote?ids=smoketest:ci-check")
          echo "$vote_resp" | python3 -c "import json,sys; json.load(sys.stdin)" || { echo "::error::/api/vote did not return valid JSON"; fail=1; }

          comments_resp=$(curl -s "$BASE/api/comments?date=2026-08-16")
          echo "$comments_resp" | python3 -c "import json,sys; json.load(sys.stdin)" || { echo "::error::/api/comments did not return valid JSON"; fail=1; }

          quiz_resp=$(curl -s "$BASE/api/quiz-stats?date=2000-01-01&total=5")
          echo "$quiz_resp" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['dist'])==6" || { echo "::error::/api/quiz-stats did not return a valid tally"; fail=1; }

          lg_code=$(curl -s -o /tmp/lg.json -w "%{http_code}" "$BASE/api/league?code=AAAAAA&meta=1")
          python3 -c "import json; d=json.load(open('/tmp/lg.json')); assert 'error' in d" && [ "$lg_code" = "404" ] || { echo "::error::/api/league did not return a JSON 404 for an unknown code (got $lg_code)"; fail=1; }

          curl -s "$BASE/api/digest" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['whatsapp'] and d['telegram']" || { echo "::error::/api/digest did not return today's post"; fail=1; }
          check_status "$BASE/share-kit.html" 200

          ctype=$(curl -s -o /dev/null -w "%{content_type}" "$BASE/api/og?type=quiz&d=2026-09-23&score=4&total=5&sq=10111")
          [ "$ctype" = "image/png" ] || { echo "::error::/api/og did not return a PNG (got $ctype)"; fail=1; }
          curl -s "$BASE/e/latest" | grep -q 'property="og:image"' || { echo "::error::/e/latest landing page has no og:image"; fail=1; }

          echo "--- checking the latest edition carries valid quiz data ---"
          python3 - "$BASE" <<'PYEOF2' || fail=1
          import json, re, sys, urllib.request
          html = urllib.request.urlopen(sys.argv[1] + "/").read().decode("utf-8")
          m = re.search(r'<script type="application/json" id="quiz-data">(.*?)</script>', html, re.S)
          if not m:
              print("::warning::latest edition has no quiz section"); sys.exit(0)
          qs = json.loads(m.group(1)).get("questions", [])
          ids = set(re.findall(r'data-story-id="([a-z]+-\d+)"', html))
          bad = [i for i, q in enumerate(qs, 1) if not (0 <= q["answer"] < len(q["options"])) or q.get("story") not in ids]
          if bad:
              print(f"::error::quiz questions {bad} are malformed"); sys.exit(1)
          print(f"OK  quiz: {len(qs)} question(s)")
          PYEOF2

          exit $fail
