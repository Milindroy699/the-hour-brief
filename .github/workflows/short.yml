name: Daily short

# The day's vertical video (YouTube Shorts / Instagram Reels / WhatsApp status): "3 things that mattered today", cut from the
# morning recording by tools/video/short.mjs. Free: it only reuses the recording (no Sarvam). Runs after each "Daily audio"
# run, or by hand. Published to R2 as shorts/<date>.mp4 / .jpg / .json; the post kit (share-kit.html and the Telegram kit
# message) picks it up from there. Its own folder, because audio.yml syncs audio/<date>/ with --delete.
on:
  workflow_run:
    workflows: ['Daily audio']
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: Edition date (YYYY-MM-DD) or "latest"
        default: latest
      force:
        description: Make it again even if today's short already matches the recording
        type: boolean
        default: false
      check:
        description: Only check the YouTube / Instagram connections (makes and posts nothing)
        type: boolean
        default: false

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the YouTube and Instagram connections
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
        run: node tools/video/publish.mjs --check
  short:
    if: (github.event_name == 'workflow_dispatch' && !inputs.check) || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                     # the latest edition pages, whatever triggered this
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make sure ffmpeg is available
        timeout-minutes: 6
        run: |
          # Most runner images have it. If not, a static build (one download, about a minute) rather than apt, which has hung for
          # 15+ minutes on a slow mirror; apt only as a time-limited fallback.
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && exit 0
          if curl -fsSL --retry 3 --max-time 180 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz; then
            tar -xJf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          else
            sudo timeout 240 apt-get update -qq && sudo timeout 240 apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Install tools
        run: |
          (cd tools/audio && npm ci --silent)
          (cd tools/video && npm ci --silent)
      - name: Work out the date, skip if this recording already has its short
        id: which
        env:
          DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          d="${DATE:-latest}"
          if [ "$d" = "latest" ]; then d=$(node -e "import('./tools/audio/script.mjs').then(m=>console.log(m.editionMeta(require('fs').readFileSync('index.html','utf8')).date))"); fi
          echo "date=$d" >> "$GITHUB_OUTPUT"
          audio=$(curl -fsS "$R2_PUBLIC_URL/audio/$d/manifest.json" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).modes.quick.file" 2>/dev/null || true)
          if [ -z "$audio" ]; then echo "no recording for $d yet"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          made=$(curl -fsS "$R2_PUBLIC_URL/shorts/$d.json" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).audio" 2>/dev/null || true)
          if [ "$made" = "$audio" ] && [ "$FORCE" != "true" ]; then echo "short for $d already matches $audio"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Make the short
        if: steps.which.outputs.skip != '1'
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}     # only used once, to record the spoken outro (then kept on R2)
        run: node tools/video/short.mjs --date "${{ steps.which.outputs.date }}" --out out/shorts
      - name: Publish (video and cover first, the json that announces them last)
        if: steps.which.outputs.skip != '1'
        run: |
          d="${{ steps.which.outputs.date }}"
          # outro clips recorded on this run: kept for every later short
          for f in out/shorts/outro-*.mp3; do if [ -e "$f" ]; then aws s3 cp "$f" "s3://$R2_BUCKET/shorts/$(basename "$f")" --endpoint-url "$R2_ENDPOINT" --content-type audio/mpeg --cache-control "public, max-age=31536000, immutable"; fi; done
          aws s3 cp "out/shorts/$d.mp4" "s3://$R2_BUCKET/shorts/$d.mp4" --endpoint-url "$R2_ENDPOINT" --content-type video/mp4 --cache-control "public, max-age=300"
          aws s3 cp "out/shorts/$d.jpg" "s3://$R2_BUCKET/shorts/$d.jpg" --endpoint-url "$R2_ENDPOINT" --content-type image/jpeg --cache-control "public, max-age=300"
          aws s3 cp "out/shorts/$d.json" "s3://$R2_BUCKET/shorts/$d.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "public, max-age=120"
          curl -fsS -o /dev/null -w "video: %{http_code} %{content_type} %{size_download} bytes\n" "$R2_PUBLIC_URL/shorts/$d.mp4"
      - name: Post to YouTube Shorts and Instagram Reels (each skips until its account is connected; never posts a date twice)
        if: steps.which.outputs.skip != '1'
        continue-on-error: true          # a platform hiccup must not mark the video itself as failed
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
        run: node tools/video/publish.mjs --date "${{ steps.which.outputs.date }}" --dir out/shorts
