<!doctype html>
<meta charset="utf-8">
<!-- Podcast cover art, 2048x2048 (Spotify and Apple ask for 1400-3000px square, JPEG or PNG). Rendered by podcast-cover.mjs.
     Built to stay readable as a 55px thumbnail: one big logo, a big two-line name, almost no small text. -->
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../../webfonts/space-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "Newsreader"; src: url("../../webfonts/newsreader-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
  html, body { margin: 0; width: 2048px; height: 2048px; overflow: hidden; }
  body {
    position: relative; background: #0c0d15; text-align: center;
    background-image: radial-gradient(circle at 50% 22%, rgba(94, 67, 243, 0.55), rgba(12, 13, 21, 0) 62%), radial-gradient(circle at 50% 110%, rgba(94, 67, 243, 0.32), rgba(12, 13, 21, 0) 55%);
  }
  .logo { position: absolute; left: 524px; top: 150px; width: 1000px; height: 1000px; filter: drop-shadow(0 0 90px rgba(124, 92, 240, 0.55)); }
  .name { position: absolute; left: 0; right: 0; top: 1240px; font-family: "Space Grotesk"; font-weight: 700; font-size: 250px; line-height: 0.96; letter-spacing: -0.035em; color: #fff; }
  .name span { display: block; color: #8b6cf6; }
  .sub { position: absolute; left: 0; right: 0; top: 1810px; font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 88px; letter-spacing: 0.01em; color: #c7c9e3; }
</style>
<img class="logo" src="logo-source.png" alt="">          <!-- the 2048px original, so nothing is stretched -->
<div class="name">THE HOUR<span>BRIEF</span></div>
<div class="sub">The daily news, read aloud</div>
